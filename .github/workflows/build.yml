name: Build TaufikAGI From Zero
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Install Android SDK 34
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Project
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts
          mkdir -p app/src/main/java/com/taufikagi/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          cat > settings.gradle.kts <<'END'
          rootProject.name = "TaufikAGI"
          include(":app")
          END
          cat > build.gradle.kts <<'END'
          plugins { id("com.android.application") version "8.2.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.22" apply false }
          END
          cat > gradle.properties <<'END'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          END
          cat > app/build.gradle.kts <<'END'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") version "1.9.22" }
          android { namespace="com.taufikagi.app"; compileSdk=34; defaultConfig { applicationId="com.taufikagi.app"; minSdk=24; targetSdk=34; versionCode=1; versionName="1.0" } }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1") }
          END
          cat > app/src/main/AndroidManifest.xml <<'END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="TaufikAGI"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          END
          echo '<resources><string name="app_name">TaufikAGI</string></resources>' > app/src/main/res/values/strings.xml
          echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:gravity="center" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:text="TaufikAGI Jalan Bos!" android:textSize="26sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout>' > app/src/main/res/layout/activity_main.xml
          cat > app/src/main/java/com/taufikagi/app/MainActivity.kt <<'END'
          package com.taufikagi.app
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() { override fun onCreate(b: Bundle?) { super.onCreate(b); setContentView(R.layout.activity_main) } }
          END
          ls -R

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TaufikAGI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
